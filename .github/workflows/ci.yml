name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Not blocking yet: ~50 pre-existing lint errors predate this workflow
      # (see REFACTOR_PLAN.md). Fix those, then flip this to a hard failure.
      - name: Lint (report only, non-blocking)
        run: npm run lint || true

      # Not blocking: a handful of genuinely one-off colors (tooltip chrome,
      # single-use accents) will always show up here by design. Surfaces new
      # drift from the shared palette in theme.ts without failing CI.
      - name: Check for hardcoded colors (report only, non-blocking)
        run: npm run check-colors || true

      # `vite build` transpiles TS via esbuild without type-checking it, so this
      # is the only step that actually enforces the Phase 8 TypeScript migration.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
